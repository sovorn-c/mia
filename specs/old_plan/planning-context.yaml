# specs/planning-context.yaml — written by elaborate-spec & scope-work
feature_name: "Minimalist Pi/Tau-Style Stream REPL & Robust Auth Flow"
problem_statement: >
  The current UI suffers from fragile raw POSIX cursor-manipulation hacks that jump,
  flicker, cut off text, and corrupt terminal prompts. Provider connection probes (e.g. GET /models)
  fail silently or reject valid API keys on custom/OpenCode/Gemini endpoints. The harness lacks
  the clean, minimalist, rock-solid inline stream REPL design of Pi and Tau.

target_architecture:
  style: "Sleek Inline Stream REPL (Claude Code / Pi / Tau style)"
  visual_theme: "Minimalist Dark with Carrot Orange accents"
  input_model: "Rock-solid standard input with clean prompt_toolkit / readline (zero raw cursor jumping)"
  auth_flow: "Pi/Tau-style provider configuration with direct probe & permissive fallback"

in_scope:
  - "Zero-glitch inline stream prompt with clean syntax, readline history, and command dispatch"
  - "Pi/Tau-style /login wizard supporting API keys (OpenCode, OpenRouter, Gemini, OpenAI, Anthropic, DeepSeek, Local/Custom) and OpenAI OAuth"
  - "Pi-style scoped /model switcher showing authenticated models + custom model input"
  - "Essential slash commands suite (/help, /login, /logout, /model, /profile, /diff, /cost, /compact, /sessions, /undo, /clear, /quit)"
  - "Minimalist live streaming renderer: clean thought display (💭), tool execution cards with duration & diff highlighting, token & cost accounting"
  - "Direct, resilient provider validation probe using lightweight chat completion instead of brittle GET /models"

out_of_scope:
  - "Heavy full-screen Textual TUI layout (deferred to Phase 2 v0.2.0)"
  - "Complex multi-agent herd sidebar tabs (consolidated into clean @mention routing in REPL)"

key_decisions:
  - decision: "Replace raw ANSI character-by-character cursor loops with robust readline / prompt_toolkit input"
    rationale: "Raw escape codes (\\x1b[nA, \\x1b[s) break across terminal emulators, resize events, and multi-line wrapping."
  - decision: "Validate API keys using lightweight 1-token probe request rather than GET /models"
    rationale: "Many providers (Gemini OpenAI endpoint, OpenCode, local Ollama) don't implement GET /models or require special permissions."
  - decision: "Adopt Pi-style minimalist single-line banner and uncluttered stream output"
    rationale: "Inline stream REPL delivers maximum speed, zero flicker, and instant responsiveness."
