# specs/planning-context.yaml — active planning context for e05
feature_name: "Plugin and Agent Template Foundation"
problem_statement: >
  Agents can persist Plugin names but Mia has no executable Plugin lifecycle, contribution loading,
  per-Agent Plugin configuration, concrete Plugin, or safe way to distribute an Agent definition.
actors:
  - "Users adding note assistance to a persisted non-built-in Agent"
  - "Agent designers instantiating a reusable Notes Agent"
  - "Plugin developers validating the first executable extension seam"
  - "Core maintainers protecting access, attribution, credentials, and Sessions"
solution_summary: >
  Prove the minimum extension boundary with one bundled Notes Plugin that contributes create, list,
  and read note capabilities under per-Agent enablement and core policy, plus one bundled Notes Agent
  Template that creates an independent secret-free Agent with the Plugin requirement.
constraints:
  - "Bundled local proof only; no registry, marketplace, arbitrary third-party loading, or dependency installation."
  - "Plugin enablement and configuration are explicit per persisted non-built-in Agent and fail closed."
  - "Plugin Tools remain behind capability filtering, access approval, security, audit, attribution, and truthful error handling."
  - "Plugin state is Agent-owned and never copied into an Agent Template."
  - "Templates exclude source identity, credentials, Sessions, memory, Plugin data, selected-default state, and full-access consent."
  - "No new runtime dependency; Python 3.12+, strict Mypy, Ruff, offline tests, and the release coverage gate remain mandatory."
out_of_scope:
  - "Remote Plugin discovery, publishing, marketplace, signing, or reputation"
  - "Arbitrary third-party code loading or dependency solving"
  - "Broad SDK hooks, workflow APIs, provider adapters, channels, or UI contributions"
  - "Plugin sandboxing, hot reload, upgrade, rollback, or background jobs"
  - "Sharing credentials, Sessions, memory, notes, or live Agent identity"
  - "Rich note editing, deletion, search, attachments, sync, or collaboration"
success_criteria:
  - "Notes installs locally, enables per Agent, and contributes create/list/read only when enabled."
  - "Notes data is isolated by Agent and disabling the Plugin preserves stored data."
  - "Core access and integrity rules govern every Plugin Tool invocation."
  - "Malformed, missing, incompatible, or undeclared Plugin contributions fail before execution."
  - "The Notes Agent Template creates a new independent Agent with no private source data."
  - "Plugin-free Agents and all e04 regressions remain green."
key_decisions:
  - decision: "Use a bundled Notes Plugin as the first executable extension."
    rationale: "It proves useful local read/write behavior, Agent-owned data, and access policy without external services."
  - decision: "Use a Notes Agent Template as the first distributable Agent."
    rationale: "It proves portable Agent configuration and Plugin requirements without copying private state."
  - decision: "Do not load arbitrary third-party Python in e05."
    rationale: "A bundled proof resolves the core contract before supply-chain, dependency, and isolation design."
  - decision: "Keep Plugin contribution types limited to Tools and one Agent Template."
    rationale: "Skills, hooks, workflows, providers, UI, and channels are speculative until a real use case requires them."
artifacts:
  scope: "specs/product/SCOPE_LATEST.yaml"
  epic: "specs/epics/e05-plugin-agent-template-foundation/epic.yaml"
  impact: "specs/IMPACT_LATEST.md"
  release_plan: "specs/release-plan.yaml"
next_skill: "kickoff-branch"
