# specs/planning-context.yaml — active planning context for e04 Agent-Centric Foundation
feature_name: "Agent-Centric Foundation"
problem_statement: >
  Mia's approved product model has one canonical identity, Agent, while the implementation still
  exposes Profile and Mode as primary concepts, does not enforce its permission labels, stores no
  native Agent homes, and offers only fixed research composition rather than direct Delegation.
actors:
  - "Everyday users working with the default Mia Agent"
  - "Users creating coding, research, review, or domain specialist Agents"
  - "Agent designers configuring capability and access boundaries"
  - "Mia runtime, security, Session, CLI, and future Plugin maintainers"
solution_summary: >
  Introduce additive named Agent identity and storage with default Mia; enforce read-only,
  approval-required, and full-access while keeping secrets machine-global; add one synchronous
  one-hop attributable Delegation primitive; and move preferred runtime/CLI language to Agent while
  retaining Profile/Mode data and commands as non-destructive v0.4 compatibility adapters.
constraints:
  - "Agent is the only target identity term; Assistant, Profile, Bot, Agent Instance, and Mode are not new target entities."
  - "Default Mia enables read_file, write_file, edit_file, and bash under approval-required access."
  - "Having no Tools is Capability Scope configuration, not another access level."
  - "Provider secrets stay in the machine-global credential store; Agent and Task data contains references only."
  - "Full-access bypasses per-action approval only and never disables permanent security or integrity rules."
  - "Delegation is one synchronous bounded Task to one explicit eligible recipient with no recursion."
  - "Legacy Profile and Session data remains readable and is never moved, rewritten, or deleted implicitly."
  - "AgentHarness remains a one-Agent headless loop independent from terminal UI code."
  - "No new runtime dependency is introduced."
out_of_scope:
  - "General Plugin SDK, marketplace, and remote installation"
  - "Persistent teams, mailboxes, queues, retries, and DAG orchestration"
  - "Parallel or recursive Delegation and background automation"
  - "External channels, browser automation, email, calendars, and schedules"
  - "OS/process/filesystem/network sandboxing"
  - "Per-Agent copied credential stores"
  - "General workflow builders or public Mode configuration"
success_criteria:
  - "Default Mia and at least two named Agents can be created, selected, persisted, inspected, and reopened."
  - "Exactly three access levels are enforced and missing approval fails closed."
  - "Agent-owned state is explicit without claiming sandbox isolation."
  - "No provider secret is persisted in Agent, Session, approval, event, audit, or Delegation artifacts."
  - "One Agent delegates one bounded Task to an eligible Agent with monotonic access and attributable terminal outcome."
  - "Canonical single and research journeys require no public Mode or Workflow selection."
  - "Legacy Profile/Mode commands, imports, files, and Sessions remain usable through warning adapters."
  - "Every prompt receives a unique Run ID while resumed Session identity remains stable."
  - "Ruff, strict Mypy, offline pytest, package build, YAML, scope, and plan-consistency checks pass."
key_decisions:
  - decision: "Use additive Agent homes with native-first legacy fallback."
    rationale: "This establishes ownership without risking destructive migration or data loss."
  - decision: "Keep credentials machine-global and reference provider/account identity from Agents."
    rationale: "Per-Agent secret copies add leakage and precedence risk without providing true sandboxing."
  - decision: "Use read-only, approval-required, and full-access only."
    rationale: "Capability availability and approval are separate; empty Tools already represents no capability."
  - decision: "Ship direct one-hop synchronous Delegation before richer orchestration."
    rationale: "It proves Agent collaboration while avoiding queues, cycles, scheduling, and recovery semantics."
  - decision: "Redefine current Profile/Mode architecture broadly through compatibility adapters."
    rationale: "One canonical Agent runtime prevents dual architecture while preserving existing user data and commands."
artifacts:
