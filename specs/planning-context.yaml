# specs/planning-context.yaml — active planning context for e06
feature_name: Zero-Legacy Agent Core
problem_statement: >
  Mia's active source, tests, CLI, TUI backend, and living documentation still expose the historical
  Profile/Mode/Workflow/Herd identity model beside the canonical Agent model. This creates duplicate
  registries and execution roots and makes public contribution confusing.
actors:
  - Public Mia users selecting and running named Agents
  - Contributors working on Agent, Skill, Tool, Plugin, Delegation, Run, and Session code
  - Maintainers protecting access, attribution, persistence, and package boundaries
  - Textual TUI users who need the existing frontend to keep working
solution_summary: >
  Establish AgentRunner and AgentRuntimeFactory as the only active runtime path, keep the Textual TUI
  as a shallow Agent-native frontend, remove Profile/Mode/Workflow/Herd implementation and compatibility
  shims, and purge active docs/specs/tests of the old identity vocabulary.
constraints:
  - Keep mia tui and Textual; do not redesign the UI or add new TUI features.
  - Do not migrate, rewrite, or delete legacy user files; make them unreachable by code.
  - Preserve Agent, Plugin, Delegation, Session, access, provider, filesystem, and redaction behavior.
  - No new runtime dependency; use strict Mypy, Ruff, offline tests, and coverage gates.
  - No public Mode or Workflow object; private sequencing may remain inside the Research Agent runner.
  - No second orchestration root, generic compatibility layer, or re-export shim.
out_of_scope:
  - TUI visual redesign, new widgets, and new interaction model
  - New Skills, Plugins, providers, channels, scheduling, or collaboration semantics
  - Automatic legacy data migration or deletion
  - Public Workflow graphs, Herd replacement, autonomous swarms, or unrestricted worker messaging
success_criteria:
  - Canonical Agent-only runtime and frontend paths pass focused and full quality gates.
  - Forbidden legacy symbols and imports are absent from active source, tests, docs, and package output.
  - Existing supported features remain green.
key_decisions:
  - decision: Keep the Textual frontend and replace only its Herd/Profile backend dependencies.
    rationale: The UI is not the identity model; preserving it avoids unnecessary product loss while deferring deeper TUI work.
  - decision: Delete compatibility code instead of translating old files or commands.
    rationale: The requested clean break targets public clarity, and Git history is sufficient preservation.
  - decision: Retain private Research Agent sequencing without a public Workflow model.
    rationale: It is useful existing behavior and fits the Agent-centric target as internal implementation logic.
  - decision: Keep Textual installed.
    rationale: mia tui remains a supported shallow frontend in this initiative.
artifacts:
  scope: specs/product/SCOPE_LATEST.yaml
  epic: specs/epics/e06-zero-legacy-agent-core/epic.yaml
  impact: specs/IMPACT_LATEST.md
  release_plan: specs/release-plan.yaml
