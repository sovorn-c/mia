  - id: e06s04t03
    title: Protect retained Textual packaging
    status: failing
    risk: P1
    depends_on: [e06s04t02]
    story_steps: [3]
    scenarios: [SC-e06s04-P1-03]
    work:
      - Keep Textual declared and retain the mia tui entrypoint.
      - Build and inspect the wheel for the retained TUI package and absence of deleted legacy packages/modules.
      - Do not remove or expand the Textual frontend.
    files:
      - pyproject.toml
      - src/mia_cli/main.py
      - src/mia_cli/tui/
    verify: >-
      grep -q 'textual>=' pyproject.toml
      && uv build --offline
      && uv run --offline python - <<'PY'
      import glob
      import zipfile
      wheels = sorted(glob.glob('dist/*.whl'))
      assert wheels
      with zipfile.ZipFile(wheels[-1]) as wheel:
          names = set(wheel.namelist())
          assert any(name.startswith('mia_cli/tui/') for name in names)
          assert not any(name.startswith(('mia_agent/profiles/', 'mia_agent/herd/', 'mia_agent/mode_runtime')) for name in names)
      print('wheel surface is clean and TUI is retained')
      PY
      && uv run --offline mia tui --help
    security: low
    allure:
      severity: high
      categories: ["Packaging", "TUI", "Build"]
