requirement_deltas:
  - story_id: "e04s01"
    type: "MODIFIED"
    requirement: "Configured runtime identity"
    before: "AgentProfile/ProfileManager are the public configured identity and coding is the default."
    after: "Agent/AgentManager are canonical, Mia is the default, and Profile data remains readable through additive compatibility."
  - story_id: "e04s02"
    type: "MODIFIED"
    requirement: "State, capability, access, and credential boundary"
    before: "Profile permission labels are not generally enforced and Session ownership follows Profile directories."
    after: "Agent state is explicit; read-only, approval-required, and full-access are enforced; empty Tools are capability configuration; secrets stay machine-global."
  - story_id: "e04s03"
    type: "ADDED"
    requirement: "Direct Agent-to-Agent Delegation"
    after: "One Agent may synchronously delegate one bounded one-hop Task to an eligible Agent and receive one attributable terminal result without access escalation."
  - story_id: "e04s04"
    type: "MODIFIED"
    requirement: "Preferred runtime and command architecture"
    before: "Mode/Profile are primary CLI/runtime concepts and interactive Runs may reuse Session-derived IDs."
    after: "AgentRunner and Agent-first commands are canonical, Research composition is private, every prompt has a unique Run ID, and Mode/Profile inputs are warning compatibility adapters."

