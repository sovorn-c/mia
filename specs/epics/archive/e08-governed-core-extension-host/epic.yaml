requirement_deltas:
  - story_id: e08s01
    type: MODIFIED
    requirement: Typed Plugin catalog and trust contract
    before: Plugin manifests describe the bundled Notes Tools and Templates, while discovery has no static Skill, provenance, or explicit trust model.
    after: Strict manifests describe declarative or trusted-code forms, static Skills/Templates, API compatibility, Core-derived provenance, and effective trust; inspection executes no Plugin callback.
  - story_id: e08s02
    type: ADDED
    requirement: Transactional Run activation and owned lifecycle
    after: Core plans the complete enabled Plugin set, activates exact dependencies deterministically through a narrow context, publishes staged contributions atomically, rolls back failures, and owns immutable Run-scoped disposal and quarantine decisions.
  - story_id: e08s03
    type: MODIFIED
    requirement: Core boundary and compatibility
    before: Bundled Plugin Tools are composed through existing middleware, but the final post-transformation host validation and broader lifecycle attribution are not a complete installed-code contract.
    after: All host-backed contributions remain inside permanent Core policy, final validation, attribution, terminal truth, Notes compatibility, Plugin-free behavior, and bounded public/package surfaces.
