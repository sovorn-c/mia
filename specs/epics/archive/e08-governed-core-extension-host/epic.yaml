id: e08
slug: governed-core-extension-host
title: Governed Core Extension Host
type: platform
status: completed
planning_stage: delivered
target_version: "0.6.0"
wsjf:
  business_value: 9
  time_criticality: 8
  risk_reduction: 10
  job_size: 5
  score: 5.4
total_bcps: 21
depends_on: [e07]
outcome: >-
  Developers can extend durable Agents through a small typed Plugin contract that cannot replace
  Core identity, trust, access, Session, attribution, cleanup, or outcome ownership through its
  supported API; trusted Python process authority remains explicit.
boundaries:
  includes:
    - Declarative and explicitly trusted installed-code Plugin forms with Core-derived provenance
    - Inspectable strict manifest contributions for Agent Templates and static Skills without Run activation
    - One narrow Run registration context for declared Tools, bounded additive context contributors, notification-only Run observers, and optional Tool middleware
    - Complete-set planning, exact dependency validation, deterministic activation, staged publication, immutable Run snapshots, rollback, and an idempotent cleanup completion-or-timeout decision before terminal-envelope emission
    - Final Core validation after Plugin Tool transformations and permanent audit, security, access, execution-limit, sanitation, and terminal-truth ownership
    - Migration of bundled Notes without changing its Plugin ID, Tool names/effects, Template, configuration, Agent-owned data, or stored format
    - Public Plugin API/version inspection, explicit trust presentation, cooperative async callback contract, conditional timeout/quarantine behavior, event-loop-blocking restart guidance, honest same-process authority, attribution, diagnostics, and Plugin-free compatibility
  excludes:
    - Generic service or dependency-injection container and Core service replacement
    - Provider, model adapter, credential, Session, Delegation, terminal outcome, or execution-root Plugins
    - Plugin commands, frontend components, renderers, keybindings, or arbitrary event names
    - Hot reload, live mutation of active Runs, child Plugin mounting, background work, or scheduler behavior
    - Remote catalogs, automatic package or dependency installation, semantic-version solving, and unrestricted project-local code loading
    - Tool overrides, mutable history interception, and operating-system or process sandbox guarantees
