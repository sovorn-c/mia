scope: specs/product/SCOPE_E14_LATEST.yaml
outcome: >-
  Users can observe and control one foreground Agent Run in a truthful inline workspace with visible
  transcript blocks, compact Tool activity, async approval, resilient focus, searchable controls, semantic
  styling, and explicit sequential follow-ups without concurrent Runs or a second execution system.
boundaries:
  includes:
    - Visible user and Agent transcript blocks with exactly-once presentation.
    - Derived Run lifecycle status and truthful adaptive footer information.
    - Compact expandable Tool summaries with bounded safe content.
    - Inline asynchronous approval with draft and focus restoration.
    - Searchable command, Agent, model, and Session selectors.
    - Explicit follow-up queue through Ctrl+Q and /queue; follow-up only, with cancellation restoration.
    - Semantic built-in message roles and accessible/plain fallbacks.
  excludes:
    - In-flight steering, concurrent Runs, background scheduling, or a general queue manager.
    - Full-screen Textual, web, desktop, or alternative frontend work.
    - New Mia Core event families unless a later interface decision justifies them.
    - Partial Tool progress, attachments/images, custom Tool renderer contracts, Plugin widgets, and user theme files.
    - Live expandable Tool cards, overlay focus stacks, flicker-free rebuilding, and queue display/edit/dequeue.
depends_on: [e13, e07, e10, e12]
planning_decisions:
  - id: e14-queue-cardinality
    decision: Single-slot follow-up queue
    rejected:
      - Multi-item FIFO without display/edit/dequeue
      - Silent replacement of an occupied slot
    rationale: >-
      Deferred architecture already treats queue display/edit/dequeue as later work because draft-only
      visibility cannot represent multiple items. Occupied-slot enqueue is rejected with an actionable
      message so user text is not silently discarded.
  - id: e14-transcript-source
    decision: Render the live user block once from admitted TurnStartEvent.user_prompt
    rejected:
      - Echo the local submit buffer and also render TurnStartEvent
      - Print a user block before Run admission
    rationale: >-
      TurnStartEvent already carries user_prompt. Rendering from the admitted turn avoids duplicate
      blocks and avoids a transcript line for a Run that never starts.
  - id: e14-approval-phase
    decision: Derive the approval phase in the CLI Adapter from the existing ApprovalRequest callback
    rejected:
      - New Core approval event family in this epic
    rationale: Approval is already a typed middleware callback; a new event family is out of scope.
  - id: e14-workspace-projection
    decision: Add one CLI-local workspace projection over existing envelopes
    reason_for_depth: >-
      Transcript, Tool rows, and footer must share one derived lifecycle so they cannot invent
      conflicting Run facts. The projection lives in mia_cli, consumes existing events, and does not
      enter mia_agent.
