outcome: >-
  All callers receive one validated, deterministic, safeguarded, and truthful Agent Run contract.
boundaries:
  includes:
    - Selected immutable Run request and closeable ordered event-stream Interface
    - Exactly one Core-finalized terminal outcome through the supported consume/cancel/awaited-close contract
    - Permanent access, security, audit, and supported execution-limit safeguards
    - Final Core Tool validation after optional Plugin transformations and terminal truth outside Plugin hooks
    - Effective Agent provider and invocation settings with secret-free errors
    - One active Run per Agent-owned Session and bounded cooperative cancellation cleanup
    - Regression evidence at public and trust-boundary Interfaces
  excludes:
    - Public lifecycle handle or callback event bus
    - Scheduler, queue, background Run manager, or remote execution
    - New providers or provider registry
    - Compatibility framework or second runtime root
    - Governed third-party Plugin host implementation beyond the existing extension boundary
