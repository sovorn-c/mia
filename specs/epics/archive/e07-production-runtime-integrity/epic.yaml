requirement_deltas:
  - story_id: e07s01
    type: MODIFIED
    requirement: Canonical Agent Run entry
    before: Frontends may consume AgentRunner.prompt() directly and infer terminal behavior from streamed Agent events.
    after: AgentRunner.run(RunRequest) is the one immutable, validated, closeable AsyncGenerator contract; Core owns identity, terminal normalization, and exactly-once finalization.
  - story_id: e07s02
    type: MODIFIED
    requirement: Runtime policy and admission
    before: Runtime construction resolves policy and Session access in separate paths without one explicit production admission contract.
    after: AgentRuntimeFactory applies effective settings, permanent safeguards, and fail-fast one-Run-per-Agent-owned-Session admission before provider execution.
  - story_id: e07s03
    type: ADDED
    requirement: Final Core Tool and Plugin boundary
    after: Core validates the final Tool identity, arguments, effects, access, security, attribution, and terminal truth after optional existing Plugin transformations and owns cooperative cleanup decisions.
