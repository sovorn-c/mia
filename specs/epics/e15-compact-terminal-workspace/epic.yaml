  score: 5.667
placement: next-release
scope: specs/product/SCOPE_E15_LATEST.yaml
outcome: >-
  Users can operate a calm, sleek inline Agent workspace with a sparse startup, terminal-native semantic
  styling, compact working and Tool rows, and a useful truthful footer.
boundaries:
  includes:
    - Sparse startup and clear presentation.
    - Semantic terminal-default styling for prompt, toolbar, streamed content, Tool, approval, and lifecycle roles.
    - Compact attributable Tool rows without duplicated names.
    - Compact working, approval, success, failure, and cancellation text.
    - Truthful footer content with narrow-width degradation.
  excludes:
    - Persistent coordinated compositor, live Tool cards, partial Tool progress, overlays, or focus stacks.
    - New Mia Core events, execution semantics, concurrent Runs, or queue changes.
    - Pi runtime dependencies, source compatibility, extension APIs, or user theme files.
depends_on: [e14]
planning_decisions:
  - id: e15-render-owner
    decision: Keep the existing prompt-toolkit plus Rich ownership model
    rationale: The visual problem is hierarchy and styling, not a missing execution or renderer contract; adding a compositor would exceed the approved request.
  - id: e15-terminal-style
    decision: Use terminal defaults plus bold, dim, reverse, and text labels
    rationale: These preserve user terminal themes and keep state meaning available in no-color output without maintaining a color palette.
  - id: e15-brand-mark
    decision: Keep one carrot brand mark and remove other decorative emoji
    rationale: The carrot is Mia's requested identity cue; additional icons make the workspace noisy and vary in terminal width.
