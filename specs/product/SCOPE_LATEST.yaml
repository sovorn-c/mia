# specs/product/SCOPE_LATEST.yaml — Bounded PRD for Mia Agent-Centric Foundation
initiative_id: "e04"
initiative_name: "Agent-Centric Foundation"
status: "approved"
supersedes: "specs/product/snapshots/SCOPE_e04-native-orchestration-run-lifecycle.yaml"

core_value: >
  Let users create and work with durable named Agents, including the default Mia Agent, and let one
  Agent safely delegate a bounded Task to another without exposing Mode or Workflow concepts.

summary: >
  Mia's approved product identity now centers one canonical object: the Agent. An Agent combines a
  durable identity with configuration, state, capabilities, access policy, and an address for
  receiving Tasks. Mia is the default personal Agent; coding, research, review, and other roles are
  named specialist Agents. Agent-to-Agent Delegation is the primary coordination primitive, while
  Workflow remains private implementation logic and Mode is absent from the target product model.

  The current product still exposes Profile and Mode concepts and supports only a fixed research
  sequence. This initiative establishes the smallest meaningful Agent-centered foundation: named
  Agent lifecycle, a default Mia Agent, compatibility for existing Profiles, explicit Agent-owned
  state and access boundaries, and one synchronous attributable Delegation path. It preserves
  current working capabilities while creating a stable seam for later Plugins and richer teams.

actors:
  - "Everyday users working with the default Mia Agent"
  - "Users creating specialist Agents for coding, research, review, or domain work"
  - "Agent designers configuring identity, capabilities, state, and access"
  - "Future Plugin developers extending Agents through a stable core boundary"

in_scope:
  - id: "e04s01"
    name: "Named Agent Vertical Slice"
    description: >
      Agent becomes the canonical configurable and addressable product object. Users can create,
      list, inspect, select, and persist named Agents, and a default personal Agent named Mia works
      without prior configuration. Existing built-in Profiles remain usable through a documented,
      non-destructive compatibility path.

  - id: "e04s02"
    name: "Agent-Owned State and Access Boundary"
    description: >
      Each Agent has an explicit ownership boundary for identity, instructions, model defaults,
      capabilities, Plugin references, access level, Sessions, memory, credential references, and
      channel identity where supported. The contract distinguishes logical Agent ownership from
      filesystem or process sandboxing, keeps provider secrets machine-global by reference, and
      supports read-only, approval-required, and full-access without silent escalation.

  - id: "e04s03"
    name: "Direct Agent-to-Agent Delegation"
    description: >
      One Agent can synchronously assign one bounded Task to one eligible recipient Agent and
      receive one attributable terminal result. Caller, recipient, Task, Run, Session, access
      context, rejection, failure, cancellation, and timeout remain distinguishable. Delegation
      does not require users to define a Mode or public Workflow.

  - id: "e04s04"
    name: "Agent-First Compatibility Migration"
    description: >
      Existing coding, architecture, minimal, single, and research behavior remains available
      through Agents during migration. Mode and Workflow stop being target product choices and are
      treated as compatibility or private execution behavior without breaking current Sessions,
      Tools, middleware protections, CLI use, or headless execution.

out_of_scope:
  - id: "oos-01"
    name: "General Plugin SDK and marketplace"
    rationale: >
      Deferred until the Agent boundary and one concrete extension use case prove what the Plugin
      contract must expose; speculative extension points would lock in unnecessary complexity.

  - id: "oos-02"
    name: "Persistent Agent mailboxes and ongoing conversations between Agents"
    rationale: >
      This initiative proves one synchronous bounded Delegation first; durable inboxes, delayed
      delivery, and resumable peer conversations require separate lifecycle and storage design.

  - id: "oos-03"
    name: "Parallel teams, group coordination, and Task DAGs"
    rationale: >
      Concurrency, fan-out, merge semantics, scheduling, and partial failure are deferred until the
      direct Delegation contract is trustworthy.

  - id: "oos-04"
    name: "Background schedules and autonomous jobs"
    rationale: >
      Cron, routines, unattended execution, wake-up behavior, and notification delivery introduce
      operational and approval concerns beyond the interactive Agent foundation.

  - id: "oos-05"
    name: "External messaging channels and broad personal integrations"
    rationale: >
      Telegram, Slack, Discord, email, calendar, and browser control depend on channel-specific
      identity, credentials, permissions, and delivery contracts not needed to prove local Agents.

  - id: "oos-06"
    name: "Filesystem or process sandbox implementation"
    rationale: >
      Agent ownership and capability scope are defined here, but Docker, VM, OS-user, and per-Agent
      process isolation require a separate security and execution initiative.

  - id: "oos-07"
    name: "Arbitrary workflow authoring"
    rationale: >
      Users coordinate Agents through Delegation. Multi-step workflow engines, visual builders,
      branching graphs, and user-authored orchestration languages are not required for this model.

  - id: "oos-08"
    name: "Comprehensive provider retry and recovery policy"
    rationale: >
      Delegation must report provider failure truthfully, but automatic retries, fallback routing,
      circuit breakers, and restart recovery need separate product decisions.

constraints:
  - "Use Agent as the only new canonical identity term; do not introduce Assistant, Profile, Bot, Agent Instance, or Mode as target entities."
  - "Preserve current Profile data, ModeRuntime internals, Workflow behavior, Sessions, Tools, and CLI journeys through explicit compatibility until separately removed."
  - "Make Agent the preferred command and configuration surface; retain Profile and Mode commands only as documented temporary aliases during e04 migration."
  - "Use only read-only, approval-required, and full-access as access levels; having no Tools remains capability configuration."
  - "Default Mia enables read_file, write_file, edit_file, and bash under approval-required access; reads run automatically and writes or shell side effects require confirmation."
  - "Keep provider secrets in the machine-global credential store and store only provider/account references in Agent state or delegated Tasks."
  - "Keep Workflow private to an Agent, Skill, or Plugin; do not require users to author orchestration graphs."
  - "Limit Delegation to one synchronous bounded Task and one recipient per call in this initiative."
  - "Never let Delegation or Plugin configuration silently expand caller or recipient access."
  - "Keep Agent logical ownership distinct from claims of filesystem, process, network, or credential isolation."
  - "Keep Agent execution headless and independent from Rich, Textual, Typer, or another UI framework."
  - "Keep Session history append-only and preserve existing durable data without destructive migration."
  - "Keep every visible Tool behind capability filtering, approval policy, middleware, audit, and error handling."
  - "Use Python 3.12+, strict Mypy, Ruff, deterministic offline tests, and no new runtime dependency unless separately approved."

success_criteria:
  - "Running `mia` without Agent configuration starts the default personal Agent named Mia."
  - "A user can create, list, inspect, select, and reopen at least two named Agents with stable unique identities."
  - "Existing coding, architect, code_mode, and minimal configurations remain available through a documented compatibility path without data loss."
  - "The system defines and enforces which configuration and durable state belongs to each Agent, while clearly stating that logical ownership is not automatic sandboxing."
  - "Each Agent selects read-only, approval-required, or full-access; no-Tools behavior is configured through capabilities rather than another access level."
  - "Provider secrets remain machine-global and neither Agent files nor delegated Tasks contain copied secret values."
  - "An Agent can delegate one bounded Task to another eligible Agent and receive one attributable result."
  - "Direct and delegated execution have unique Run and Task identities and retain caller, recipient, Agent, Session, and access-policy attribution."
  - "Successful, failed, rejected, cancelled, and timed-out delegated Tasks remain distinguishable and cannot be reported as success."
  - "Delegation applies the effective caller and recipient access constraints without silent privilege escalation."
  - "Users can perform the supported single-Agent and research journeys without selecting a Mode or defining a Workflow."
  - "Current Sessions, Tools, middleware protections, headless execution, CLI behavior, and deterministic provider tests remain compatible."
  - "Focused Agent and Delegation tests, Ruff, strict Mypy, offline pytest, build, and specification checks pass."

