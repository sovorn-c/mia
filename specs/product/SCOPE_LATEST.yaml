# specs/product/SCOPE_LATEST.yaml — bounded PRD for the Agent core clean break
initiative_id: e06
initiative_name: Agent Core Clean Break
status: approved

core_value: >-
  Give Mia one clear Agent identity and one trusted execution path so users and contributors can work
  from the same public model.
summary: >-
  Mia keeps its released Agent, Plugin, Delegation, Session, access, provider, and Textual capabilities.
  This initiative makes Agent the only public identity, routes every supported frontend through
  AgentRunner and AgentRuntimeFactory, and removes obsolete project artifacts without touching user files.

in_scope:
  - id: e06s01
    name: Canonical Agent Run Runtime
    description: >-
      Keep clean Agent/Run/Task/Session contracts and one AgentRunner/AgentRuntimeFactory execution path.
  - id: e06s02
    name: Agent-Native Textual TUI Adapter
    description: >-
      Keep mia tui and its visual behavior while listing named Agents and streaming AgentRunner events.
  - id: e06s03
    name: Canonical Runtime and CLI Surface
    description: >-
      Keep one Agent schema, native registry, access vocabulary, runtime, CLI, REPL, and Session path.
  - id: e06s04
    name: Project Surface Purge and Clean-Break Gate
    description: >-
      Rewrite active guidance and specifications, remove obsolete repository artifacts, retain Textual
      packaging, and prove the source and package surfaces are clean.

out_of_scope:
  - id: oos-01
    name: TUI redesign or feature expansion
    rationale: Preserve the current interaction shape; deeper UX work needs a separate scope.
  - id: oos-02
    name: Automatic migration or deletion of user files
    rationale: Repository cleanup must not make destructive filesystem changes outside the checkout.
  - id: oos-03
    name: New Skills, Plugins, providers, channels, or collaboration features
    rationale: New capabilities need their own bounded scope.
  - id: oos-04
    name: New multi-Agent runtime infrastructure
    rationale: Existing bounded Delegation and private research sequencing are sufficient.
  - id: oos-05
    name: Changing AgentHarness semantics or access safeguards
    rationale: This initiative changes composition and project vocabulary, not loop or security behavior.

constraints:
  - Use Agent, Skill, Tool, Plugin, Task, Delegation, Run, and Session as the active domain vocabulary.
  - AgentRunner and AgentRuntimeFactory remain the only active prompt composition path.
  - Keep AgentHarness headless and keep mia_agent independent from UI frameworks and terminal output.
  - Keep the Textual dependency and mia tui command.
  - Preserve Plugin, Delegation, Session, access, provider, filesystem, and redaction boundaries.
  - Do not read, project, rewrite, or delete user files outside the repository.
  - Use Python 3.12+, Pydantic boundaries, strict Mypy, Ruff, offline pytest, and coverage gates.
  - Do not add a runtime dependency or a generic migration framework.

success_criteria:
  - Every supported prompt frontend uses AgentRunner and AgentRuntimeFactory once per execution path.
  - Runtime identities and event envelopes contain Agent, Run, Task, and Session attribution.
  - AgentManager resolves built-in and native persisted Agents with Agent-owned Session paths.
  - Obsolete source packages, commands, aliases, and project artifacts are absent.
  - mia tui remains launchable and streams events for built-in or persisted Agents.
  - Existing Plugin, Delegation, access, Session, provider, filesystem, and Template tests remain green.
  - Living docs and instructions teach only the Agent-centric model.
  - Ruff, Mypy, pytest, coverage, package build, YAML validation, and public-surface scans pass.

references:
  - specs/product/VISION_LATEST.yaml
  - specs/product/GLOSSARY_LATEST.yaml
  - specs/tech-architecture/tech-stack.md
  - specs/IMPACT_LATEST.md
  - specs/planning-context.yaml
