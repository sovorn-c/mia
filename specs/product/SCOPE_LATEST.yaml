# Incremental feature scope for v0.7.0; e14 workspace behavior remains the functional baseline.
initiative_id: release-v0.7.0-compact-terminal-workspace
initiative_name: Mia Compact Terminal Workspace
status: approved-blueprint
target_release: v0.7.0-agent-workspace

core_value: >-
  Users get a calm, terminal-native Agent workspace that keeps working state, Tool activity, approvals,
  and useful context visible without decorative noise or forced colors.

summary: >-
  Refine the e14 inline workspace visually. Remove the information-heavy startup banner, reduce emoji and
  decorative headings to the carrot brand mark, replace forced 24-bit colors with terminal-native semantic
  styles, and make the working, Tool, approval, and footer lines compact enough to remain readable during
  normal terminal work.

  This is a CLI presentation change only. It preserves the existing AgentRunner execution path, typed event
  lifecycle, Tool middleware, append-only Sessions, prompt-toolkit ownership, Rich/plain output, normal
  scrollback, single-slot follow-up queue, and existing selector behavior.

in_scope:
  - id: e15-sparse-startup
    maps_to: e15s01
    name: Sparse startup presentation
    outcome: Startup and clear show one quiet brand/workspace line rather than a boxed telemetry banner.
  - id: e15-semantic-terminal-style
    maps_to: e15s01
    name: Terminal-native semantic styling
    outcome: Interactive prompt, toolbar, selectors, working state, and streamed content use bold/dim/reverse semantic roles and terminal defaults instead of forced hex colors.
  - id: e15-working-state
    maps_to: e15s01
    name: Compact working and Tool state
    outcome: Thinking, responding, Tool, approval, success, failure, and cancellation states remain attributable through concise text labels and bounded rows.
  - id: e15-footer
    maps_to: e15s01
    name: Useful compact footer
    outcome: The bottom toolbar keeps workspace, Agent/model, usage/context, and lifecycle state with truthful narrow-width degradation.

out_of_scope:
  - id: e15-oos-compositor
    name: Persistent coordinated compositor or live Tool cards
    rationale: The current request is a visual cleanup; differential rebuilding, overlays, and live cards remain deferred until the existing inline owner cannot present them reliably.
  - id: e15-oos-core
    name: New Mia Core event families or execution semantics
    rationale: Existing typed events already express the displayed states; presentation must not infer or invent new Core facts.
  - id: e15-oos-pi
    name: Pi dependency, source compatibility, or extension API adoption
    rationale: Pi remains read-only prior art and adds no value as a runtime dependency for this refinement.
  - id: e15-oos-themes
    name: User-loadable theme files or a theme configuration system
    rationale: Terminal defaults and semantic roles solve the immediate forced-color problem without a new abstraction.
  - id: e15-oos-queue
    name: Queue cardinality or follow-up behavior changes
    rationale: e14's single-slot follow-up contract is complete and must remain unchanged.

constraints:
  - Preserve AgentRunner → AgentRuntimeFactory → AgentHarness as the only prompt execution path.
  - Keep AgentHarness independent from Rich, prompt-toolkit, Typer, and terminal output.
  - Keep prompt-toolkit as the interactive input owner; do not run competing live renderers.
  - Preserve normal scrollback, append-only Sessions, Tool middleware, approval focus, and Core-owned terminal truth.
  - Preserve plain and non-interactive output and no-color accessibility.
  - Add no runtime dependency and do not persist new UI state.
  - Keep user-controlled, Tool, and approval text bounded and sanitized.

success_criteria:
  - Interactive startup and /clear no longer render a boxed multi-field telemetry banner.
  - The carrot is the only decorative brand icon; state meaning remains available through text labels.
  - No affected interactive UI path forces hex colors; terminal defaults, bold, dim, and reverse carry hierarchy.
  - Tool rows do not repeat the Tool name, remain attributable by call ID, and retain bounded expansion behavior.
  - Approval, success, failure, and cancellation remain visually distinct without depending on color or emoji.
  - The footer remains truthful, compact, escaped, and useful at normal and narrow widths.
  - Existing e14 lifecycle, safety, approval, queue, plain-mode, and selector tests continue to pass.

references:
  - specs/product/SCOPE_E14_LATEST.yaml
  - specs/epics/archive/e14-agent-workspace-interaction/epic.yaml
  - specs/tech-architecture/REPL-UI-FUTURE-DIRECTIONS.md
  - specs/IMPACT_LATEST.md
  - specs/adr/0002-canonical-run-request-stream.md
