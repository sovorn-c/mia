# specs/product/SCOPE_LATEST.yaml — Bounded PRD for Mia Plugin and Agent Template Foundation
initiative_id: "e05"
initiative_name: "Plugin and Agent Template Foundation"
status: "approved"
supersedes: "specs/product/snapshots/SCOPE_e04-agent-centric-foundation.yaml"

core_value: >
  Let users add one useful executable capability to an Agent and create a reusable Agent from a
  safe template without exposing credentials, private state, or core integrity controls.

summary: >
  Mia now has durable named Agents, explicit access boundaries, and direct Delegation. The next
  product gap is executable extension: Agents can record Plugin names, but no Plugin can be
  installed, enabled, inspected, configured, or used. Agent definitions also cannot be shared
  safely without copying private configuration and state.

  This initiative proves the smallest Plugin boundary with one concrete Notes Plugin and one Notes
  Agent Template. The Notes Plugin contributes Agent-scoped note capabilities, is explicitly
  installed into Mia and enabled per Agent, and remains subject to core Tool, access, audit,
  attribution, and storage rules. The Notes Agent Template creates a new independent Agent with the
  Plugin requirement and useful defaults while excluding credentials, Sessions, memory, notes, and
  another user's identity. A broad SDK, remote registry, and arbitrary third-party dependency
  installation remain deferred until this proof exposes real extension needs.

actors:
  - "Users adding local note assistance to a persisted named Agent"
  - "Agent designers creating a reusable Notes Agent from a safe template"
  - "Plugin developers validating Mia's first executable extension contract"
  - "Mia Core maintainers protecting access, attribution, Sessions, and credentials"

in_scope:
  - id: "e05s01"
    name: "Notes Plugin Vertical Slice"
    description: >
      A user can install the bundled Notes Plugin, enable it for one Agent, and use that Agent to
      create, list, and read Agent-scoped notes. Plugin-contributed actions are visible only when
      enabled and execute through Mia Core under the Agent's capability and access policy.

  - id: "e05s02"
    name: "Per-Agent Plugin Lifecycle and Integrity Boundary"
    description: >
      Users can list and inspect installed Plugins, enable or disable one Plugin per Agent, and save
      its validated Agent-specific configuration. Mia reports missing, malformed, incompatible, or
      undeclared contributions without partially activating them. Plugin data, output, errors, and
      events remain Agent-attributed and cannot bypass credential, access, or Session safeguards.

  - id: "e05s03"
    name: "Portable Notes Agent Template"
    description: >
      Users can inspect and instantiate a bundled Notes Agent Template as a new independently owned
      Agent. The template declares its Plugin requirement and useful defaults but carries no source
      Agent identity, credentials, Sessions, memory, notes, or full-access consent. Missing Plugin
      requirements and Agent ID collisions fail with actionable, non-destructive errors.

out_of_scope:
  - id: "oos-01"
    name: "Remote Plugin registry or marketplace"
    rationale: >
      Deferred until one bundled Plugin proves the install, enablement, contribution, and trust
      contracts; discovery, publishing, reputation, and remote supply-chain policy are separate work.

  - id: "oos-02"
    name: "Arbitrary third-party Python loading and dependency installation"
    rationale: >
      Executing unknown local code or installing its dependencies requires package provenance,
      compatibility, and isolation decisions that are not needed for the bundled proof.

  - id: "oos-03"
    name: "Broad Plugin SDK, hooks, or workflow framework"
    rationale: >
      The initiative supports only the contracts exercised by Notes and its Agent Template; hooks,
      private workflows, provider adapters, channels, and speculative extension points are deferred.

  - id: "oos-04"
    name: "Plugin sandboxing or claims that trusted code is isolated"
    rationale: >
      Mia enforces Tool and integrity boundaries but does not yet provide process, filesystem,
      network, or operating-system isolation for executable Plugin code.

  - id: "oos-05"
    name: "Plugin hot reload, upgrade, rollback, or dependency solving"
    rationale: >
      Version transitions and live code replacement add recovery and compatibility semantics beyond
      install-once local proof; restart-based activation is sufficient for this initiative.

  - id: "oos-06"
    name: "Plugin-contributed UI, background jobs, or external channels"
    rationale: >
      Terminal widgets, schedules, autonomous execution, browser control, messaging, email, and
      calendar integrations each need separate lifecycle and permission contracts.

  - id: "oos-07"
    name: "Sharing live Agents or private Agent state"
    rationale: >
      Agent Templates distribute definitions only. Synchronizing credentials, Sessions, memory,
      notes, defaults, or identity would violate Agent ownership and privacy boundaries.

  - id: "oos-08"
    name: "General note editor, search engine, or synchronization service"
    rationale: >
      Create, list, and read are enough to prove executable extension. Rich editing, deletion,
      indexing, attachments, cloud sync, and collaborative notebooks are separate product features.

  - id: "oos-09"
    name: "Mutable Plugin overlays for immutable built-in Agents"
    rationale: >
      The first proof enables Plugins on persisted user-created Agents and the Notes Agent created
      from its Template. Customizing built-ins such as Mia requires a separate override contract so
      built-in immutability is not weakened implicitly.

constraints:
  - "Use Plugin for installable executable extension and Agent Template for a distributable definition; neither becomes an Agent identity or owns core routing."
  - "Prove only one bundled Notes Plugin and one bundled Notes Agent Template; add no general-purpose extension point without a demonstrated Notes requirement."
  - "Plugin installation is explicit and local; Plugin enablement and configuration are explicit per persisted non-built-in Agent."
  - "Disabled, missing, malformed, incompatible, or undeclared Plugin contributions fail closed and do not partially alter an Agent runtime."
  - "Every Plugin-contributed Tool is capability-filtered and executes through access policy, approval, security, audit, cost, attribution, and error handling."
  - "A Plugin cannot silently expand an Agent's Tools, access level, delegation targets, full-access consent, credentials, or storage boundary."
  - "Notes are private Agent-owned Plugin data and are not copied into Agent Templates."
  - "Agent Templates exclude credentials, account secrets, Sessions, memory, Plugin data, selected-default state, and full-access consent."
  - "Existing Agents without Plugins, Profile/Mode compatibility, Delegation, Sessions, and current Tools remain functional."
  - "Keep Agent execution headless and keep Plugin contracts independent from Rich, Textual, Typer, and terminal rendering."
  - "Use Python 3.12+, strict Mypy, Ruff, deterministic offline tests, append-only Session behavior, and no new runtime dependency."

success_criteria:
  - "A user can install and inspect the bundled Notes Plugin without network access."
  - "A user can enable Notes for one Agent without enabling it for another Agent."
  - "An enabled Agent can create, list, and read its own notes, while another Agent cannot see those notes through the Plugin."
  - "Disabling Notes removes its contributed capabilities from later Runs without deleting stored notes."
  - "Note reads follow non-mutating policy and note creation follows side-effect approval policy; permanent security rules remain active."
  - "Plugin-contributed Tool calls, results, errors, and durable data retain Agent, Run, Session, and Plugin attribution where those identities apply."
  - "Malformed, incompatible, missing, or undeclared Plugin contributions produce actionable failures before execution and never fall back to unrestricted behavior."
  - "A user can inspect and instantiate the bundled Notes Agent Template under a new Agent ID."
  - "The instantiated Notes Agent is independent, requires the installed Notes Plugin, and contains no source identity, credentials, Sessions, memory, notes, or inherited full-access consent."
  - "Agent ID collisions and missing Plugin requirements do not overwrite or partially create Agent data."
  - "Existing Plugin-free Agents and all e04 Agent, Delegation, access, Session, CLI, and compatibility journeys remain green."
  - "Focused Plugin and Agent Template tests, the release coverage gate, Ruff, strict Mypy, offline pytest, build, and specification checks pass."

references:
  - "specs/product/VISION_LATEST.yaml"
  - "specs/product/GLOSSARY_LATEST.yaml"
  - "specs/product/snapshots/SCOPE_e04-agent-centric-foundation.yaml"
  - "specs/tech-architecture/tech-stack.md"
  - "specs/IMPACT_LATEST.md"
  - "specs/adr/0001-prompt-scoped-orchestration-runs.md"

resolved_decisions:
  - id: "VISION-05"
    decision: >
      The first executable extension is the bundled Notes Plugin, and the first distributable Agent
      is a Notes Agent Template contributed with it. Together they prove installation, per-Agent
      enablement, core-mediated Tools, Agent-owned Plugin data, and secret-free template creation
      without committing Mia to a broad SDK or remote marketplace.
