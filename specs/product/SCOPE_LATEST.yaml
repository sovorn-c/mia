prior_art: |
  ## Prior Art

  | Candidate | Source | Verdict | Notes |
  | --- | --- | --- | --- |
  | Canonical Agent runtime | `src/mia_agent/agent_runner.py`, `src/mia_agent/runtime_factory.py` | deepen | Preserve the one execution path and move terminal truth and Session admission behind its Interface. |
  | Runtime and persistence contracts | `src/mia_agent/runtime_*.py`, `src/mia_agent/session/` | extend | Existing attributed events and append-only history remain the base; no second model is required. |
  | Access and middleware | `src/mia_middleware/`; historical DSH reference in pre-purge `docs/initial_plan/REFERENCES.md` | deepen | Preserve the DeepSeek Harness onion/waterfall `pre-execute → execute → post-execute` pattern through the existing ToolPipeline; permanent safeguards and durable local diagnostics must become production behavior. |
  | Plugin lifecycle and effects | `src/mia_agent/plugins.py`, Pi Extensions, DSH/Cordis lifecycle and service composition | deepen selectively | Use Pi-like registration ergonomics plus DSH dependency-ready activation, owned effects, rollback, and teardown; reject generic Core replacement and service/event containers. |
  | Supported frontend | `src/mia_cli/` | adapt | CLI and REPL remain shallow Adapters to the selected Run Interface. |
  | Deterministic test seam | `src/mia_ai/providers/mock.py`, `tests/` | adopt | MockProvider remains the offline verification seam. |
  | Packaging | `pyproject.toml`, Hatchling, uv | adopt | The existing Python distribution model is the release and deployment target. |

  No hosted platform, remote telemetry product, container runtime, new provider, remote Plugin catalog,
  automatic Plugin package installer, or generic service framework is required for v0.6.0.
