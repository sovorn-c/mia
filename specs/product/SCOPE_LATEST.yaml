# specs/product/SCOPE_LATEST.yaml — Bounded PRD for Mia Stream REPL & Auth
core_value: "Ultra-fast, zero-flicker, minimalist inline stream REPL with rock-solid provider auth and Pi-style model switching."

summary: >
  Mia is re-architected into a clean, minimalist inline stream REPL inspired by Pi, Tau, and Claude Code.
  It completely replaces fragile, flickering character-by-character ANSI cursor loops with a resilient
  line-editing engine. It establishes a robust provider credential model with direct chat completion
  validation probes (eliminating brittle GET /models assumptions), a clean scoped model switcher (/model),
  and a focused suite of 12 essential slash commands with seamless stream rendering.

in_scope:
  - id: "e01s01"
    name: "Rock-Solid Terminal Input & Navigation"
    description: "Stable line-editing prompt with history (~/.mia/history), arrow recall, Tab autocomplete, and zero-flicker selection menu."
  - id: "e01s02"
    name: "Pi/Tau Provider Auth & Connection Probe"
    description: "Multi-provider authentication for OpenCode, OpenRouter, Gemini, OpenAI, Anthropic, DeepSeek, and Custom with lightweight 1-token probe."
  - id: "e01s03"
    name: "Scoped Model Switcher & Essential Slash Commands"
    description: "Interactive /model switcher dynamically scoped to authenticated providers, plus full suite of 12 essential slash commands."
  - id: "e01s04"
    name: "Minimalist Stream Rendering & Live Tool Diffs"
    description: "Clean inline stream output with subtle thinking indicators (💭), single-line tool cards, and Monokai syntax-highlighted git diffs."
  - id: "e02s01"
    name: "prompt_toolkit Integration & Floating Slash Autocomplete"
    description: "Production prompt_toolkit PromptSession with live floating dropdown on '/', bracketed paste multi-line editor, and pinned status footer."
  - id: "e02s02"
    name: "Minimalist Working Stream & carrot_bounce Animation"
    description: "Signature carrot_bounce animated working spinner, single-line in-place tool status badges, and memory-buffered raw reasoning tokens."
  - id: "e02s03"
    name: "Post-Turn Inspection & JSONL Tree Navigator"
    description: "Ctrl+O (/inspect) detailed audit viewer and Esc (/tree) conversation branch navigator and turn forking."
  - id: "e02s04"
    name: "Pi/Tau Keybindings & Context Bootstrap"
    description: "Ctrl+C input buffer clearing, Ctrl+D clean exit, /stop turn abort, and auto-discovery of AGENTS.md / git status."

out_of_scope:
  - id: "oos-01"
    name: "Heavy full-screen Textual TUI canvas"
    rationale: "Full-screen TUI widgets cause layout thrashing and terminal conflicts; user specifically requested a minimalist inline REPL."
  - id: "oos-02"
    name: "Multi-agent sidebar tabs in terminal"
    rationale: "Multi-agent interactions are streamlined into inline @mention prompt routing."
  - id: "oos-03"
    name: "Hardcoded /undo command"
    rationale: "Replaced with JSONL branch tree navigation (/tree) which guarantees safe checkpoints without untracked git assumptions."

constraints:
  - "Runtime: Python 3.12+ (strictly typed with Mypy, Ruff-formatted)."
  - "Zero raw ANSI cursor manipulation loops that break terminal wrapping or physical line counts."
  - "Key validation must never falsely block local/Ollama, Gemini, or OpenCode endpoints."

success_criteria:
  - "uv run mia launches instantly with a clean single-line header banner without screen flickering."
  - "/login allows pasting API keys or authenticating OpenAI OAuth, verifies connection with a 1-token test, and saves to ~/.mia/credentials.json."
  - "/model displays only authenticated providers and their models, with clean arrow/numeric selection."
  - "Typing '/' immediately renders a sleek floating dropdown that dynamically filters keystrokes (/l -> /login, /logout) with zero ghost popup trails."
  - "Active agent turns display signature carrot_bounce (🥕 ) spinner and in-place tool status without dumping 500-line raw outputs."
  - "Pressing Ctrl+O (/inspect) expands full tool execution logs and diffs, Esc (/tree) navigates conversation branches, and Ctrl+C clears prompt line."
  - "All automated tests in tests/ pass with 100% strict type-checking (uv run mypy src)."

references:
  - "specs/old_plan/mia_harness.md"
  - "specs/old_plan/mia_tui_harness.md"
  - "specs/tech-architecture/tech-stack.md"

