# specs/product/SCOPE_LATEST.yaml — Bounded PRD for Mia Native Orchestration
core_value: >
  Make orchestration Mia's single execution architecture: every prompt enters a mode runtime,
  while the default one-node mode preserves today's fast Pi/Tau-style behavior and an explicit
  research mode proves deterministic one-shot specialist delegation end to end.

summary: >
  This slice establishes the canonical separation "Mode composes; Profile configures; Workflow
  coordinates; Agent executes; Plugin extends." It inserts a headless mode runtime above the
  existing AgentHarness without changing AgentHarness into a multi-agent manager. The existing
  interactive and headless CLIs use the same runtime. A built-in single mode remains the default;
  a built-in research mode runs one task-local architect specialist followed by the selected
  coordinator profile. Typed envelopes make every event attributable to its mode, run, task, and
  agent. The legacy src/mia_agent/herd implementation is not an architectural input. A small
  follow-up aligns the inline REPL's essential slash-command descriptions with behavior that is
  actually implemented, including durable manual compaction.

in_scope:
  - id: "e03s01"
    name: "Native Orchestration Mode Vertical Slice"
    description: >
      Add validated mode/workflow definitions, one shared AgentHarness factory, an orchestration
      event envelope, a one-node compatibility path, a deterministic research workflow with a
      task-local specialist, durable child lineage, and explicit /mode and --mode selection.
  - id: "e03s02"
    name: "Essential Slash Command Contract Alignment"
    description: >
      Make command completion, help, and dispatch share one canonical list; implement real manual
      context compaction; preserve state on invalid profile selection; report Git failures; and
      remove unsupported active-turn cancellation from the advertised command suite.

out_of_scope:
  - id: "oos-01"
    name: "Continuable child agents"
    rationale: "Restart recovery and later follow-up messages require lifecycle semantics beyond the first vertical slice."
  - id: "oos-02"
    name: "Durable team mailbox and shared task DAG"
    rationale: "The first slice proves deterministic one-shot delegation before introducing team coordination state."
  - id: "oos-03"
    name: "Automatic mode or workflow inference"
    rationale: "Mode selection remains explicit until behavior, cost, and latency are measurable."
  - id: "oos-04"
    name: "User plugin loading and built-in memory service"
    rationale: "Plugin and memory contracts remain architectural terms but are not implemented in this story."
  - id: "oos-05"
    name: "Full-screen multi-agent UI"
    rationale: "Both current terminal adapters consume the headless runtime; orchestration correctness precedes new presentation work."
  - id: "oos-06"
    name: "Legacy Herd migration"
    rationale: "src/mia_agent/herd and its Textual path are experimental/legacy and do not constrain the native runtime design."
  - id: "oos-07"
    name: "Concurrent input and active-turn cancellation"
    rationale: "The serial inline REPL cannot accept /stop during a turn; a later lifecycle story must design concurrent input and cancellation before the command is advertised."

constraints:
  - "Runtime: Python 3.12+ with strict Mypy and Ruff formatting."
  - "AgentHarness remains the executor for exactly one agent and imports no terminal UI."
  - "AgentProfile remains configuration for one role; it does not absorb mode, workflow, memory, or plugin responsibilities."
  - "Every tool visible to an agent is filtered by that agent's profile and executed through ToolPipeline."
  - "Root and child transcripts remain append-only JSONL session trees."
  - "No new runtime dependency is introduced; PyYAML is a development-only prerequisite for repository planning gates."
  - "Existing uncommitted user changes must be preserved."

success_criteria:
  - "Both `mia` and `mia run` submit prompts through the native mode runtime."
  - "Default single mode preserves current AgentEvent order, profile tool filtering, middleware, session resume/tree behavior, token accounting, and Rich rendering."
  - "`/mode` and `--mode` explicitly list or select validated modes; unknown modes fail with an actionable error."
  - "Research mode runs one task-local architect specialist before coordinator synthesis, using separate AgentHarness instances and sessions."
  - "Every runtime event identifies mode, workflow run, task, agent, and profile while retaining the original typed AgentEvent payload."
  - "Specialist failure or cancellation prevents later stages and emits a typed terminal error."
  - "Focused orchestration tests, the existing suite, Ruff, and strict Mypy pass offline."
  - "Completion, help, and prefix matching expose the same 18 canonical slash commands."
  - "Manual /compact changes active context and appends a durable compaction checkpoint."
  - "Invalid profile selection and failed Git inspection report errors without partial state mutation or false success."
  - "Unsupported /stop and /abort commands are not advertised until concurrent cancellation exists."
  - "Model discovery includes every connected provider and excludes unconnected providers; /scoped-models controls Ctrl+P cycling."
  - "Interactive exit output identifies the session and top-level mia --session resumes it."

references:
  - "specs/IMPACT_LATEST.md"
  - "specs/tech-architecture/tech-stack.md"
  - "specs/old_plan/mia_harness.md"
