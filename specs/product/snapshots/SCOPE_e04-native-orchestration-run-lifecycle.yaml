    verdict: "extend"
    notes: "ModeRuntime already owns mode routing and event envelopes; AgentHarness already owns one-agent turns and session context."
  - candidate: "Tau reusable harness lifecycle"
    source: "/Users/sovorn/dev/pi/pi-architecture/tau/src/tau_agent/harness.py"
    verdict: "adopt"
    notes: "Reject overlapping prompts, keep active-run state in the harness boundary, and expose lifecycle state separately from transcript messages."
  - candidate: "Tau append-only session tree"
    source: "/Users/sovorn/dev/pi/pi-architecture/tau/dev-notes/architecture/phase-7-session-tree.md"
    verdict: "adopt"
    notes: "Keep durable history append-only and reconstruct active context by replaying a selected root-to-leaf path."
  - candidate: "Pi stateful Agent lifecycle"
    source: "/Users/sovorn/dev/pi/pi-architecture/pi/packages/agent/src/agent.ts"
    verdict: "adopt"
    notes: "Keep active-run ownership and abort state separate from the durable message transcript."
  - candidate: "DeepSeek Harness tool outcome pipeline"
    source: "/Users/sovorn/dev/pi/pi-architecture/deepseek-harness/packages/core/tools/src/index.ts"
    verdict: "adapt"
    notes: "Preserve explicit policy, execution, cancellation, and immutable result distinctions without importing the larger plugin framework."
