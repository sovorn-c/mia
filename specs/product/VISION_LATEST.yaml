# specs/product/VISION_LATEST.yaml — approved Mia product vision

document:
  title: Mia Product Vision
  status: approved
  approved_on: '2026-09-02'
  reason_for_existence: "Define Mia's product object, boundaries, and truthful capability claims."
  planning_rule: "Future scope and implementation must align with the Agent-centric identity."

identity:
  name: Mia
  expanded_name: Modular Intelligent Agent
  category: Lightweight modular local Agent core
  one_liner: >-
    Mia is a local Agent system where people create durable Agents that use Skills, Tools, and Plugins
    and can delegate bounded Tasks to other Agents.
  vision: >-
    Make trustworthy Agent work natural for users while giving contributors a small core with explicit
    access, persistence, attribution, and extension boundaries.

positioning:
  primary: A general-purpose local Agent system centered on named durable Agents.
  default_experience: Running `mia` opens the default personal Agent named Mia.
  not_primary:
    - A coding-only product
    - A required graph-design product
    - An autonomous swarm platform
    - An empty framework requiring setup before first use
  differentiation:
    - One identity term across users, configuration, documentation, and code.
    - Useful by default while remaining general at the core.
    - Bounded Agent-to-Agent Delegation through Mia Core.
    - Per-Agent Plugins without giving Plugins ownership of core integrity.
    - User-controlled access with durable Sessions and truthful outcomes.

canonical_terms:
  Agent: Durable identity with configuration, state, capabilities, and an address for Tasks.
  Skill: Reusable instruction, knowledge, or procedure.
  Tool: Callable capability exposed through Mia Core.
  Plugin: Installable declarative or trusted-code extension governed by Mia Core.
  Task: Bounded work assigned to an Agent.
  Delegation: One Agent assigning a Task to another through Mia Core.
  Run: One execution of an Agent.
  Session: Durable append-only conversation history.

product_principles:
  - name: One identity term
    rule: Use Agent consistently for a durable configured intelligent identity.
  - name: Agent first
    rule: People create, select, configure, run, and delegate to named Agents.
  - name: Useful by default
    rule: Running `mia` starts the default personal Agent without extra setup.
  - name: General at the core
    rule: Core execution does not assume one professional vertical.
  - name: Delegation before graph design
    rule: An Agent assigns bounded Tasks through a core protocol.
  - name: Plugins extend through contracts
    rule: >-
      Agents explicitly enable Plugins; the supported Plugin API cannot replace core policy,
      while trusted Python process authority is stated honestly.
  - name: User-controlled trust
    rule: Access is read-only, approval-required, or full-access with explicit consent.
  - name: Honest capability
    rule: Mia claims only integrations, isolation, and autonomy that are implemented.

agent_model:
  definition: >-
    A durable addressable entity combining identity, configuration, private state, enabled capabilities,
    access policy, Plugins, and collaboration behavior.
  owns_or_selects:
    - Identity and instructions
    - Model and provider references
    - Private memory and durable Sessions
    - Skills and Tools
    - Enabled and configured Plugins
    - Capability scope and access policy
    - Stable address for delegated Tasks
  execution_distinction: "The Agent is durable; a Run is one execution and does not create another identity."

capability_model:
  skill: "Reusable instruction, knowledge, or procedure that guides an Agent."
  tool: "Callable action mediated by Mia Core."
  plugin:
    definition: >-
      Installable declarative or trusted-code extension contributing only declared capability types
      through the governed Core host.
    lifecycle:
      - Discover and inspect a bundled or already installed Plugin without running its activation callback.
      - Assign effective provenance and trust through Mia Core; a Plugin cannot self-promote.
      - Explicitly trust executable code, then enable and configure the Plugin per persisted Agent.
      - Plan and activate the complete enabled set transactionally for one immutable Run snapshot.
      - Dispose Plugin effects deterministically without deleting durable Plugin data.
      - Keep contributed Tools and middleware inside permanent Core controls.
      - Keep static Skills and Agent Templates inspectable without executing a Run activation callback.
    initial_contributions:
      catalog:
        - Agent Templates
        - Static Skills
      runtime:
        - Tools and bounded additive context
        - Notification-only Run observers
        - Optional Tool middleware inside the final Core validation gate
    never_owns:
      - Agent identity or Task routing
      - Credential secrecy or provider resolution
      - Access, approval, permanent safeguards, or terminal truth
      - Session integrity or mutable history
      - Event attribution, Plugin trust, or Plugin lifecycle policy through the supported Plugin API

collaboration:
  primary_primitive: Agent-to-Agent Delegation
  definition: >-
    Mia Core routes a bounded Task from one Agent to another and returns an attributable result or a
    truthful failure, rejection, cancellation, or timeout.
  core_contract:
    - Stable Agent identity and recipient eligibility
    - Bounded Task submission and result delivery
    - Caller and recipient attribution
    - Restrictive access propagation
    - Failure, rejection, cancellation, and timeout semantics
    - Agent-owned Session persistence

users:
  - group: Everyday users
    interaction: Run `mia` and work with the default Agent.
    concepts_needed: [Agent]
  - group: Specialist users
    interaction: Create, select, and delegate to named specialist Agents.
    concepts_needed: [Agent, Task, Delegation, Access Policy]
  - group: Agent designers
    interaction: Configure identity, Skills, Tools, Plugins, state, and access.
    concepts_needed: [Agent, Skill, Tool, Plugin]
  - group: Plugin developers
    interaction: >-
      Add declared capabilities through the narrow Plugin registration context without editing Mia Core,
      while accepting explicit trust, attribution, compatibility, and cleanup rules.
    concepts_needed: [Plugin, Tool, Skill, Runtime events]

access_model:
  principle: "Capability scope, access policy, isolation, and permanent integrity safeguards are separate controls."
  access_levels:
    - name: read-only
      behavior: Expose and run only non-mutating capabilities.
    - name: approval-required
      behavior: Run safe reads automatically and ask before writes or other side effects.
    - name: full-access
      behavior: Run enabled capabilities without per-action approval after explicit opt-in; permanent safeguards remain.
  permanent_integrity_rules:
    - Never leak credentials through output, logs, events, or delegated Tasks.
    - Validate Plugin declarations, trust, contributions, and Tool inputs at trust boundaries.
    - Revalidate Plugin-transformed Tool arguments before approval and execution.
    - Keep execution, Plugin lifecycle, and delegated outcomes attributable.
    - Never report failed, rejected, cancelled, or timed-out work as successful.
    - Never let a Plugin or Delegation silently increase access.

core_boundary:
  core_owns:
    - Provider and streaming contracts
    - Agent discovery, execution, and Task routing
    - Runs, Tasks, events, and truthful outcomes
    - Sessions and context continuity
    - Tool invocation and middleware
    - Access-policy enforcement
    - Plugin discovery, effective trust, dependency order, activation, attribution, cleanup, and contribution contracts
  agent_owns_or_selects:
    - Identity and role behavior
    - Private configuration and state
    - Enabled Skills, Tools, and Plugins
    - Default collaboration strategy
  packaging_rule: "Keep the default Agent, current Tools, Plugins, CLI, and REPL packaged together; additional frontends are external adapters."

current_reality:
  status: >-
    The implementation provides named built-in and persisted Agents, Agent-owned Sessions, enforced
    access policy, bounded Delegation, Plugin lifecycle, Notes Tools, Agent Templates, and Agent-first CLI/REPL.
    The full-screen Textual frontend is intentionally not part of the supported product surface. Its current
    Plugin implementation is a bundled catalog; the governed
    developer extension host is approved v0.6.0 work, not yet delivered.
  supported_tools: [read_file, write_file, edit_file, bash, note_create, note_list, note_read]
  known_limits:
    - The local filesystem and process boundary is not an operating-system sandbox.
    - Plugin catalog and provider support are intentionally small.
    - Trusted Python Plugin code is not an operating-system or process sandbox.
    - v0.6.0 does not include remote Plugin catalogs, automatic dependency installation, generic Core services, Plugin commands/UI, or provider replacement.
    - The inline CLI/REPL is the supported interactive terminal surface; full-screen terminal frontends are out of scope.

settled_decisions:
  - id: VISION-01
    decision: "Mia defaults to read/write/edit/shell Tools under approval-required access."
  - id: VISION-02
    decision: "Agent homes own configuration and Sessions; provider secrets stay in the credential store."
  - id: VISION-03
    decision: "Access supports read-only, approval-required, and full-access; full-access requires explicit consent."
  - id: VISION-04
    decision: "Notes Plugin and Notes Agent Template migrate as the compatibility proof for the governed extension host."
  - id: VISION-05
    decision: "Historical v0.6.0 decision: Textual remained installed and `mia tui` was supported; superseded by VISION-08."
  - id: VISION-06
    decision: >-
      Plugin authors receive a small Pi-like registration context with DSH-inspired dependency-ready
      activation, owned effects, rollback, and Core-owned cleanup deadlines; Mia Core services remain non-replaceable.
  - id: VISION-08
    decision: >-
      Mia supports one built-in interactive terminal surface through the inline CLI/REPL. The full-screen
      Textual frontend and `mia tui` command are removed; future web or desktop interfaces use the UI-independent Core contract.

open_decisions:
  - id: VISION-07
    question: "Which additional Plugin contribution types, providers, or channels should receive a separate bounded scope?"

verification:
  command: >
    uv run --offline python -c "import pathlib,yaml; yaml.safe_load(pathlib.Path('specs/product/VISION_LATEST.yaml').read_text())"
