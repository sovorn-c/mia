# specs/product/GLOSSARY_LATEST.yaml — canonical Mia language

document:
  title: "Mia Agent-Centric Language"
  status: approved
  authority: "Source of truth for target product terminology."
  projection: specs/UBIQUITOUS_LANGUAGE_LATEST.md
  scope: "Agent identity, capability, extension, delegation, and execution"
  product_vision: specs/product/VISION_LATEST.yaml
  runtime_model: specs/tech-architecture/tech-stack.md

invariant: "Agent acts; Skill guides; Tool enables; Plugin extends; Agent delegates through Mia Core."

classification_rules:
  - "Agent is the only durable configured and addressable intelligent identity."
  - "A Run is one execution of one Agent."
  - "A Skill is reusable instruction or procedure; a Tool is callable capability."
  - "A Plugin is an installable extension that contributes declared capabilities."
  - "A Task is bounded work; Delegation routes it between Agents through Mia Core."
  - "Mia Core owns identity, routing, access, Sessions, event integrity, cancellation, and outcomes."

terms:
  - term: Mia Core
    group: Foundation
    kind: platform_core
    definition: "Trusted runtime boundary for Agent execution, routing, policy, persistence, and events."
    responsibility: "Provides the core execution and collaboration boundary"
  - term: Agent
    group: Identity
    kind: durable_entity
    identity: agent_id
    definition: "Durable addressable identity combining instructions, configuration, state, Tools, Plugins, and access policy."
    responsibility: "Receives work, acts through capabilities, and may delegate Tasks"
    examples: [Mia, Research Agent, Coding Agent]
  - term: Skill
    group: Capabilities
    kind: reusable_instruction
    definition: "Reusable instruction, knowledge, or procedure that guides an Agent."
    responsibility: "Guides behavior"
  - term: Tool
    group: Capabilities
    kind: callable_capability
    definition: "Callable capability exposed through Mia Core policy and middleware."
    responsibility: "Enables an Agent to act"
  - term: Plugin
    group: Extension
    kind: installable_extension
    definition: "Installable executable extension contributing declared Tools, Skills, or Templates."
    responsibility: "Extends an Agent through explicit lifecycle controls"
  - term: Agent Template
    group: Extension
    kind: distributable_definition
    definition: "Shareable starting definition used to create an independent Agent without private state."
    responsibility: "Distributes a reusable Agent design"
  - term: Task
    group: Collaboration
    kind: runtime_entity
    identity: task_id
    definition: "Bounded work assigned to an Agent with one attributable outcome."
    responsibility: "Owns one unit of assigned work"
  - term: Delegation
    group: Collaboration
    kind: core_protocol
    definition: "Core-mediated assignment of a Task between Agents with access, attribution, timeout, and cancellation semantics."
    responsibility: "Coordinates Agents safely"
  - term: Run
    group: Execution
    kind: runtime_entity
    identity: run_id
    definition: "One prompt- or Task-scoped execution of one Agent."
    responsibility: "Owns execution progress and its truthful outcome"
  - term: Runtime Identity
    group: Execution
    kind: value_object
    definition: "Immutable attribution for Run, Agent, Session, and optional Task lineage."
    responsibility: "Attributes runtime activity"
  - term: Event Envelope
    group: Execution
    kind: value_object
    definition: "Immutable attribution wrapper around an Agent or core event."
    responsibility: "Makes emitted activity attributable"
  - term: Session
    group: Conversation
    kind: durable_entity
    identity: session_id
    definition: "Append-only conversation history owned by an Agent and reused across Runs."
    responsibility: "Persists context"
  - term: Session Tree
    group: Conversation
    kind: aggregate
    definition: "Append-only tree of immutable Session Entries with one active path."
    responsibility: "Owns durable conversation branching"
  - term: Turn
    group: Execution
    kind: runtime_entity
    identity: turn_index
    definition: "One input and the Agent activity needed for one terminal result."
    responsibility: "Owns ordered model interaction Steps"
  - term: Step
    group: Execution
    kind: runtime_entity
    identity: step_index
    definition: "One model interaction within a Turn, including Tool Invocations and usage."
    responsibility: "Advances a Turn"
  - term: Tool Invocation
    group: Execution
    kind: runtime_entity
    identity: call_id
    definition: "One Tool request carried through core policy and middleware to a terminal result."
    responsibility: "Executes one authorized capability request"
  - term: Access Policy
    group: Trust
    kind: policy
    definition: "One of read-only, approval-required, or full-access, controlling mutation and confirmation."
    responsibility: "Controls side effects"
  - term: Capability Scope
    group: Trust
    kind: policy
    definition: "Declared Tools, Plugins, resources, and delegation targets available to an Agent."
    responsibility: "Bounds available capability"
  - term: Terminal Outcome
    group: State semantics
    kind: value
    definition: "Final success, failure, rejection, cancellation, timeout, or skip result."
    responsibility: "Closes a Run, Task, Turn, or Tool Invocation truthfully"

relationships:
  - "An Agent selects Skills, Tools, Plugins, Access Policy, and Capability Scope."
  - "One Agent can own multiple Sessions and execute multiple Runs."
  - "A Plugin can contribute an Agent Template but does not become the created Agent."
  - "One caller Agent delegates one Task to one recipient Agent through Mia Core."
  - "A Run executes exactly one Agent and may originate from direct input or a delegated Task."
  - "Mia Core enforces identity, access, attribution, Session integrity, and Terminal Outcomes."

flagged_ambiguities:
  - term: Agent scope
    resolution: "Agent is durable identity and configuration; Run is temporary execution."
  - term: Agent isolation
    resolution: "Agent is a logical state boundary; filesystem or process isolation must be implemented and claimed separately."
  - term: Task
    resolution: "Use Task for runtime work assigned to an Agent and backlog task for planning work."
